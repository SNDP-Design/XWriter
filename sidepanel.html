<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XWriter</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>XWriter</h1>
            <p id="pageLabel">Waiting for a text post</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="refreshBtn" class="btn ghost" type="button">New six</button>
          <button id="settingsBtn" class="btn ghost" type="button" aria-expanded="false" aria-controls="settings">
            Settings
          </button>
        </div>
      </header>

      <section id="settings" class="settings" hidden>
        <label for="apiKey">OpenAI API key</label>
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-..." />
        <p id="keyStatus" class="hint">Paste a key, then save it.</p>
        <div class="settings-actions">
          <button id="saveKeyBtn" class="btn solid" type="button">Save key</button>
          <button id="clearKeyBtn" class="btn ghost" type="button">Remove</button>
        </div>
        <p class="hint">The key stays on this computer. It is sent only to OpenAI to write the six replies.</p>

        <label for="voice" class="section-label">Your voice</label>
        <textarea id="voice" rows="7" spellcheck="false" placeholder="Paste 5 to 10 replies you wrote on X, one per line."></textarea>
        <p id="voiceStatus" class="hint">Replies will copy the way you write.</p>
        <div class="settings-actions">
          <button id="saveVoiceBtn" class="btn solid" type="button">Save voice</button>
          <button id="clearVoiceBtn" class="btn ghost" type="button">Remove</button>
        </div>
      </section>

      <p id="banner" class="banner" hidden></p>
      <p id="status" class="status" hidden></p>

      <section id="progress" class="progress" role="status" aria-live="polite" hidden>
        <div class="progress-head">
          <span class="spinner" aria-hidden="true"></span>
          <p id="progressTitle" class="progress-title">Writing six replies</p>
        </div>
        <p id="progressText" class="hint">Reading the post…</p>
        <div class="progress-track" aria-hidden="true"><span id="progressBar" class="progress-bar"></span></div>
      </section>

      <ol id="answers" class="answers"></ol>

      <section id="empty" class="empty">
        <p class="empty-title" id="emptyTitle">No replies yet</p>
        <p id="emptyText">Open a text post on X.</p>
      </section>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
